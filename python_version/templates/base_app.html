{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashigo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        /* ============================================
           RASHIGO APP SHELL - Clean Modern Dark UI
           ============================================ */

        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-surface: #334155;
            --accent-primary: #38BDF8;
            --accent-secondary: #6366F1;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: rgba(148, 163, 184, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* App Shell Layout */
        .app-shell {
            display: grid;
            grid-template-columns: 72px 1fr;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .app-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 8px;
        }

        .sidebar-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-logo:hover {
            border-radius: 12px;
            transform: scale(1.05);
        }

        .sidebar-logo svg {
            width: 24px;
            height: 24px;
            color: var(--bg-primary);
        }

        .sidebar-divider {
            width: 32px;
            height: 2px;
            background: var(--border-color);
            margin: 8px 0;
        }

        .sidebar-item {
            width: 48px;
            height: 48px;
            background: var(--bg-surface);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            border: none;
            color: var(--text-secondary);
        }

        .sidebar-item:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-radius: 16px;
        }

        .sidebar-item.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-radius: 16px;
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 32px;
            background: var(--accent-primary);
            border-radius: 0 4px 4px 0;
        }

        .sidebar-item svg {
            width: 22px;
            height: 22px;
        }

        .sidebar-tooltip {
            position: absolute;
            left: 64px;
            background: var(--bg-surface);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.15s ease;
            z-index: 1000;
            border: 1px solid var(--border-color);
        }

        .sidebar-item:hover .sidebar-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-bottom {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Main Content Area */
        .main-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .topbar {
            height: 52px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Main Viewport */
        #main-viewport {
            flex: 1;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        /* Voice Call Pop-up Widget */
        .voice-popup {
            position: fixed;
            bottom: 16px;
            left: 88px;
            width: 280px;
            background: var(--bg-secondary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: none;
            overflow: hidden;
        }

        .voice-popup.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .voice-popup-header {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .voice-popup-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--bg-primary);
            font-size: 13px;
            font-weight: 600;
        }

        .voice-popup-title svg {
            width: 16px;
            height: 16px;
        }

        .voice-popup-server {
            color: rgba(15, 23, 42, 0.7);
            font-size: 11px;
            font-weight: 500;
        }

        .voice-popup-close {
            background: none;
            border: none;
            color: var(--bg-primary);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .voice-popup-close:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .voice-popup-close svg {
            width: 16px;
            height: 16px;
        }

        .voice-popup-body {
            padding: 12px;
        }

        .voice-popup-users {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .voice-popup-user {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-primary);
            font-size: 11px;
            font-weight: 700;
            border: 2px solid transparent;
        }

        .voice-popup-user.speaking {
            border-color: #10B981;
            animation: speakingPulse 1s infinite;
        }

        @keyframes speakingPulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
            }

            50% {
                box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
            }
        }

        .voice-popup-controls {
            display: flex;
            gap: 8px;
        }

        .voice-popup-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .voice-popup-btn.mute {
            background: var(--bg-surface);
            color: var(--text-secondary);
        }

        .voice-popup-btn.mute:hover {
            background: #475569;
        }

        .voice-popup-btn.mute.active {
            background: #EF4444;
            color: white;
        }

        .voice-popup-btn.leave {
            background: #DC2626;
            color: white;
        }

        .voice-popup-btn.leave:hover {
            background: #B91C1C;
        }

        .voice-popup-btn svg {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <!-- Sidebar Navigation -->
        <nav class="app-sidebar">
            <!-- Logo -->
            <a href="/" class="sidebar-logo" title="Rashigo">
                <!-- Lucide: MessageCircle -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
                </svg>
            </a>

            <div class="sidebar-divider"></div>

            <!-- Home -->
            <button class="sidebar-item {% if current_view == 'home' %}active{% endif %}"
                hx-get="/?view=home&partial=true" hx-target="#main-viewport" hx-swap="innerHTML"
                onclick="setActiveNav(this)">
                <!-- Lucide: Home -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span class="sidebar-tooltip">{% trans "Home" %}</span>
            </button>

            <!-- My Servers -->
            <button class="sidebar-item" hx-get="/?view=servers&partial=true" hx-target="#main-viewport"
                hx-swap="innerHTML" onclick="setActiveNav(this)">
                <!-- Lucide: Server -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
                    <rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
                    <line x1="6" x2="6.01" y1="6" y2="6" />
                    <line x1="6" x2="6.01" y1="18" y2="18" />
                </svg>
                <span class="sidebar-tooltip">{% trans "My Servers" %}</span>
            </button>

            <!-- Games -->
            <button class="sidebar-item" hx-get="/game-lobby/?partial=true" hx-target="#main-viewport"
                hx-swap="innerHTML" onclick="setActiveNav(this)">
                <!-- Lucide: Gamepad2 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" x2="10" y1="11" y2="11" />
                    <line x1="8" x2="8" y1="9" y2="13" />
                    <line x1="15" x2="15.01" y1="12" y2="12" />
                    <line x1="18" x2="18.01" y1="10" y2="10" />
                    <path
                        d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
                </svg>
                <span class="sidebar-tooltip">{% trans "Games" %}</span>
            </button>

            <!-- Leaderboard -->
            <button class="sidebar-item" hx-get="/leaderboard/?partial=true" hx-target="#main-viewport"
                hx-swap="innerHTML" onclick="setActiveNav(this)">
                <!-- Lucide: Trophy -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
                    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
                    <path d="M4 22h16" />
                    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
                    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
                    <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
                </svg>
                <span class="sidebar-tooltip">{% trans "Leaderboard" %}</span>
            </button>

            <div class="sidebar-bottom">
                <!-- Settings -->
                <button class="sidebar-item {% if current_view == 'settings' %}active{% endif %}" hx-get="/"
                    hx-vals='{"view": "settings", "partial": "true"}' hx-target="#main-viewport" hx-swap="innerHTML"
                    onclick="setActiveNav(this)">
                    <!-- Lucide: Settings -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span class="sidebar-tooltip">{% trans "Settings" %}</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <span class="topbar-title">Rashigo</span>
                <div class="topbar-user">
                    <span class="user-name">{{ user.username }}</span>
                    <div class="user-avatar">{{ user.username|first|upper }}</div>
                </div>
            </header>

            <!-- Viewport for Dynamic Content -->
            <div id="main-viewport">
                {% include 'partials/_home.html' %}
            </div>
        </main>
    </div>

    <!-- Voice Call Pop-up Widget (Shows when in voice on another page) -->
    <div id="voice-popup" class="voice-popup">
        <div class="voice-popup-header">
            <div>
                <div class="voice-popup-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                    </svg>
                    {% trans "Voice Connected" %}
                </div>
                <div class="voice-popup-server"></div>
            </div>
            <button class="voice-popup-close" onclick="window.voiceClient && window.voiceClient.disconnect()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="voice-popup-body">
            <div class="voice-popup-users" id="voice-popup-users"></div>
            <div class="voice-popup-controls">
                <button class="voice-popup-btn mute" onclick="window.voiceClient && window.voiceClient.toggleMute()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" x2="12" y1="19" y2="22" />
                    </svg>
                    {% trans "Mute" %}
                </button>
                <button class="voice-popup-btn leave" onclick="window.voiceClient && window.voiceClient.disconnect()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path
                            d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" />
                        <line x1="22" x2="2" y1="2" y2="22" />
                    </svg>
                    {% trans "Leave" %}
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/voice_client.js' %}"></script>
    <script>
        function setActiveNav(element) {
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
        }
    </script>
</body>

</html>
