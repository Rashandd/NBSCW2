<!DOCTYPE html>
<html>
<head>
    <title>Voice Connection - Persistent</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 8px; 
            background: #0F172A; 
            color: #38BDF8; 
            font-family: 'Segoe UI', sans-serif; 
            font-size: 11px; 
        }
        .status { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            padding: 4px 8px;
            background: rgba(0, 255, 128, 0.1);
            border-radius: 4px;
            margin-bottom: 6px;
        }
        .dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: #6366F1;
            flex-shrink: 0;
        }
        .dot.disconnected { background: #FF0064; }
        .dot.connecting { background: #FFA500; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        #participants {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .participant {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 10px;
        }
        .participant.muted { opacity: 0.6; }
        .participant .avatar {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38BDF8, #FF00FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            color: #0F172A;
        }
        
        /* Video Grid */
        #video-container {
            display: none;
            margin-top: 6px;
        }
        #video-container.has-video {
            display: block;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 4px;
        }
        .video-item {
            position: relative;
            background: #1a1f3e;
            border-radius: 6px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-item .video-label {
            position: absolute;
            bottom: 2px;
            left: 2px;
            background: rgba(0,0,0,0.7);
            color: #38BDF8;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 8px;
        }
        .video-item.screen-share {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Ready</span>
    </div>
    <div id="participants"></div>
    <div id="video-container">
        <div class="video-grid" id="video-grid"></div>
    </div>
    
    <script>
        // ============================================
        // PERSISTENT VOICE FRAME
        // Maintains WebSocket + WebRTC across page navigations
        // ============================================
        
        // State
        let voiceSocket = null;
        let localStream = null;
        let localVideoStream = null;
        let localScreenStream = null;
        let peerConnections = {};
        let participants = new Map(); // normalized username -> { userId, username, muted, video, screen }
        
        let isMuted = false;
        let isDeafened = false;
        let isCameraOn = false;
        let isScreenSharing = false;
        
        let channelSlug = null;
        let channelName = null;
        let serverSlug = null;
        let userId = null;
        let username = null;
        
        const iceCandidateQueues = {};
        
        // ICE Servers
        const iceServers = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'stun:stun2.l.google.com:19302' },
        ];
        
        // ============================================
        // DOM Updates
        // ============================================
        
        function updateStatus(text, state = 'connected') {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if (txt) txt.textContent = text;
            if (dot) {
                dot.classList.remove('disconnected', 'connecting');
                if (state === 'disconnected') dot.classList.add('disconnected');
                else if (state === 'connecting') dot.classList.add('connecting');
            }
        }
        
        function updateParticipantsUI() {
            const container = document.getElementById('participants');
            if (!container) return;
            
            container.innerHTML = '';
            participants.forEach((data, key) => {
                const el = document.createElement('div');
                el.className = 'participant' + (data.muted ? ' muted' : '');
                el.innerHTML = `
                    <span class="avatar">${data.username.charAt(0).toUpperCase()}</span>
                    <span>${data.username}</span>
                    ${data.muted ? '<span>🔇</span>' : ''}
                    ${data.video ? '<span>📹</span>' : ''}
                    ${data.screen ? '<span>🖥️</span>' : ''}
                `;
                container.appendChild(el);
            });
        }
        
        function updateVideoGrid() {
            const container = document.getElementById('video-container');
            const grid = document.getElementById('video-grid');
            if (!container || !grid) return;
            
            // Check if we have any video streams
            let hasVideo = false;
            
            // Local video
            if (isCameraOn && localVideoStream) {
                hasVideo = true;
                let localVideo = document.getElementById('local-video');
                if (!localVideo) {
                    const div = document.createElement('div');
                    div.className = 'video-item';
                    div.id = 'local-video-container';
                    div.innerHTML = `
                        <video id="local-video" autoplay muted playsinline></video>
                        <span class="video-label">You</span>
                    `;
                    grid.appendChild(div);
                    localVideo = document.getElementById('local-video');
                }
                if (localVideo.srcObject !== localVideoStream) {
                    localVideo.srcObject = localVideoStream;
                }
            } else {
                const localVideoContainer = document.getElementById('local-video-container');
                if (localVideoContainer) localVideoContainer.remove();
            }
            
            // Local screen share
            if (isScreenSharing && localScreenStream) {
                hasVideo = true;
                let screenVideo = document.getElementById('local-screen');
                if (!screenVideo) {
                    const div = document.createElement('div');
                    div.className = 'video-item screen-share';
                    div.id = 'local-screen-container';
                    div.innerHTML = `
                        <video id="local-screen" autoplay muted playsinline></video>
                        <span class="video-label">Your Screen</span>
                    `;
                    grid.appendChild(div);
                    screenVideo = document.getElementById('local-screen');
                }
                if (screenVideo.srcObject !== localScreenStream) {
                    screenVideo.srcObject = localScreenStream;
                }
            } else {
                const screenContainer = document.getElementById('local-screen-container');
                if (screenContainer) screenContainer.remove();
            }
            
            // Check remote videos
            grid.querySelectorAll('.video-item[data-peer-id]').forEach(el => {
                hasVideo = true;
            });
            
            container.classList.toggle('has-video', hasVideo);
        }
        
        // ============================================
        // Communication with Parent
        // ============================================
        
        function sendToParent(type, data = {}) {
            if (window.parent !== window) {
                window.parent.postMessage({ type, data }, '*');
            }
        }
        
        window.addEventListener('message', async (event) => {
            // Only accept messages from parent
            if (event.source !== window.parent) return;
            
            const { type, data } = event.data || {};
            console.log('[VoiceFrame] Received:', type);
            
            switch (type) {
                case 'connect':
                    await handleConnect(data);
                    break;
                    
                case 'disconnect':
                    handleDisconnect();
                    break;
                    
                case 'toggleMute':
                    toggleMute();
                    break;
                    
                case 'toggleDeafen':
                    toggleDeafen();
                    break;
                    
                case 'toggleCamera':
                    await toggleCamera();
                    break;
                    
                case 'toggleScreenShare':
                    await toggleScreenShare();
                    break;
                    
                case 'getState':
                    sendToParent('state', getState());
                    break;
                    
                case 'setVolume':
                    setUserVolume(data.peerId, data.volume);
                    break;
            }
        });
        
        function getState() {
            return {
                connected: voiceSocket && voiceSocket.readyState === WebSocket.OPEN,
                channelSlug,
                channelName,
                serverSlug,
                userId,
                username,
                muted: isMuted,
                deafened: isDeafened,
                cameraOn: isCameraOn,
                screenSharing: isScreenSharing,
                participants: Array.from(participants.values())
            };
        }
        
        // ============================================
        // Connection Handling
        // ============================================
        
        async function handleConnect(config) {
            // If already connected to same channel, don't reconnect
            if (voiceSocket?.readyState === WebSocket.OPEN && channelSlug === config.channelSlug) {
                console.log('[VoiceFrame] Already connected to this channel');
                sendToParent('connected', getState());
                return;
            }
            
            // Disconnect from previous channel if any
            if (voiceSocket) {
                handleDisconnect();
            }
            
            // Store config
            channelSlug = config.channelSlug;
            channelName = config.channelName;
            serverSlug = config.serverSlug;
            userId = config.userId;
            username = config.username;
            isMuted = config.muted || false;
            isDeafened = config.deafened || false;
            
            try {
                updateStatus('Getting microphone...', 'connecting');
                
                // Get audio stream
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                
                if (isMuted) {
                    localStream.getAudioTracks().forEach(t => t.enabled = false);
                }
                
                // Add self to participants
                addParticipant(userId, username, isMuted);
                
                // Connect WebSocket
                updateStatus('Connecting...', 'connecting');
                connectWebSocket(config.wsUrl);
                
            } catch (err) {
                console.error('[VoiceFrame] Mic error:', err);
                updateStatus('Mic error: ' + err.message, 'disconnected');
                sendToParent('error', { message: err.message });
            }
        }
        
        function handleDisconnect() {
            // Close WebSocket
            if (voiceSocket) {
                voiceSocket.close();
                voiceSocket = null;
            }
            
            // Close all peer connections
            Object.keys(peerConnections).forEach(closePeerConnection);
            
            // Stop local streams
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            if (localVideoStream) {
                localVideoStream.getTracks().forEach(t => t.stop());
                localVideoStream = null;
            }
            if (localScreenStream) {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
            }
            
            // Reset state
            isCameraOn = false;
            isScreenSharing = false;
            participants.clear();
            
            channelSlug = null;
            channelName = null;
            
            updateStatus('Disconnected', 'disconnected');
            updateParticipantsUI();
            updateVideoGrid();
            sendToParent('disconnected', {});
        }
        
        // ============================================
        // Participant Management (Idempotent)
        // ============================================
        
        function normalizeUsername(name) {
            return (name || '').toLowerCase().trim();
        }
        
        function addParticipant(pUserId, pUsername, pMuted = false, pVideo = false, pScreen = false) {
            const key = normalizeUsername(pUsername);
            if (!key) return false;
            
            // IDEMPOTENT: Check if already exists
            if (participants.has(key)) {
                // Update existing
                const existing = participants.get(key);
                existing.muted = pMuted;
                existing.video = pVideo;
                existing.screen = pScreen;
                participants.set(key, existing);
                console.log(`[VoiceFrame] Updated participant: ${pUsername}`);
            } else {
                // Add new
                participants.set(key, {
                    odedId: pUserId,
                    userId: pUserId,
                    username: pUsername,
                    muted: pMuted,
                    video: pVideo,
                    screen: pScreen
                });
                console.log(`[VoiceFrame] Added participant: ${pUsername}`);
            }
            
            updateParticipantsUI();
            sendToParent('participantsChanged', { participants: Array.from(participants.values()) });
            return true;
        }
        
        function removeParticipant(pUsername) {
            const key = normalizeUsername(pUsername);
            if (participants.has(key)) {
                participants.delete(key);
                console.log(`[VoiceFrame] Removed participant: ${pUsername}`);
                updateParticipantsUI();
                sendToParent('participantsChanged', { participants: Array.from(participants.values()) });
                return true;
            }
            return false;
        }
        
        function updateParticipantState(pUsername, updates) {
            const key = normalizeUsername(pUsername);
            if (participants.has(key)) {
                const p = participants.get(key);
                Object.assign(p, updates);
                participants.set(key, p);
                updateParticipantsUI();
                sendToParent('participantsChanged', { participants: Array.from(participants.values()) });
            }
        }
        
        // ============================================
        // WebSocket
        // ============================================
        
        function connectWebSocket(wsUrl) {
            voiceSocket = new WebSocket(wsUrl);
            
            voiceSocket.onopen = () => {
                console.log('[VoiceFrame] WebSocket connected');
                updateStatus('Connected: ' + channelName, 'connected');
                
                // Send join signal
                voiceSocket.send(JSON.stringify({
                    signal_type: 'join',
                    data: { 
                        channel_slug: channelSlug, 
                        username: username,
                        has_video: isCameraOn,
                        has_screen: isScreenSharing
                    }
                }));
                
                sendToParent('connected', getState());
            };
            
            voiceSocket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    handleSocketMessage(data);
                } catch (err) {
                    console.error('[VoiceFrame] Parse error:', err);
                }
            };
            
            voiceSocket.onclose = () => {
                console.log('[VoiceFrame] WebSocket closed');
                // Don't call handleDisconnect here - let parent decide
                updateStatus('Connection lost', 'disconnected');
                sendToParent('connectionLost', { channelSlug, channelName });
            };
            
            voiceSocket.onerror = (err) => {
                console.error('[VoiceFrame] WebSocket error:', err);
                updateStatus('Connection error', 'disconnected');
            };
        }
        
        function handleSocketMessage(data) {
            // Forward all events to parent
            sendToParent('voiceEvent', data);
            
            switch (data.type) {
                case 'system_notification':
                    handleSystemNotification(data);
                    break;
                    
                case 'webrtc_signal':
                    handleWebRTCSignal(data);
                    break;
                    
                case 'media_state':
                    handleMediaState(data);
                    break;
            }
        }
        
        function handleSystemNotification(data) {
            if (data.event === 'member_joined') {
                // IDEMPOTENT: addParticipant checks for duplicates
                if (data.sender_id !== userId) {
                    addParticipant(data.sender_id, data.username, false, data.has_video, data.has_screen);
                    // Create peer connection
                    createPeerConnection(data.sender_id, data.username, true);
                }
            } else if (data.event === 'member_left') {
                removeParticipant(data.username);
                closePeerConnection(data.sender_id);
            }
        }
        
        function handleMediaState(data) {
            const key = normalizeUsername(data.username);
            if (participants.has(key)) {
                updateParticipantState(data.username, {
                    muted: data.muted,
                    video: data.has_video,
                    screen: data.has_screen
                });
            }
        }
        
        // ============================================
        // WebRTC
        // ============================================
        
        function createPeerConnection(peerId, peerUsername, isInitiator) {
            // Clean up existing connection
            if (peerConnections[peerId]) {
                closePeerConnection(peerId);
            }
            
            iceCandidateQueues[peerId] = [];
            
            const pc = new RTCPeerConnection({ iceServers });
            peerConnections[peerId] = { 
                pc, 
                username: peerUsername, 
                remoteDescriptionSet: false,
                audioElement: null,
                videoElement: null
            };
            
            // Add local tracks
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }
            if (localVideoStream) {
                localVideoStream.getTracks().forEach(track => {
                    pc.addTrack(track, localVideoStream);
                });
            }
            if (localScreenStream) {
                localScreenStream.getTracks().forEach(track => {
                    pc.addTrack(track, localScreenStream);
                });
            }
            
            pc.onicecandidate = (event) => {
                if (event.candidate && voiceSocket?.readyState === WebSocket.OPEN) {
                    voiceSocket.send(JSON.stringify({
                        signal_type: 'ice_candidate',
                        recipient_id: peerId,
                        data: { candidate: event.candidate }
                    }));
                }
            };
            
            pc.ontrack = (event) => {
                const stream = event.streams[0];
                if (!stream) return;
                
                const peerData = peerConnections[peerId];
                if (!peerData) return;
                
                // Determine if this is audio or video
                const track = event.track;
                if (track.kind === 'audio') {
                    // Create audio element if not exists
                    let audio = peerData.audioElement;
                    if (!audio) {
                        audio = document.createElement('audio');
                        audio.id = `audio-${peerId}`;
                        audio.autoplay = true;
                        audio.dataset.peerId = peerId;
                        document.body.appendChild(audio);
                        peerData.audioElement = audio;
                    }
                    audio.srcObject = stream;
                    if (isDeafened) audio.muted = true;
                    
                } else if (track.kind === 'video') {
                    // Create video element in grid
                    const grid = document.getElementById('video-grid');
                    let videoContainer = document.getElementById(`video-${peerId}`);
                    if (!videoContainer) {
                        videoContainer = document.createElement('div');
                        videoContainer.className = 'video-item';
                        videoContainer.id = `video-${peerId}`;
                        videoContainer.dataset.peerId = peerId;
                        videoContainer.innerHTML = `
                            <video autoplay playsinline></video>
                            <span class="video-label">${peerUsername}</span>
                        `;
                        grid.appendChild(videoContainer);
                    }
                    const video = videoContainer.querySelector('video');
                    video.srcObject = stream;
                    peerData.videoElement = video;
                    
                    updateVideoGrid();
                }
                
                sendToParent('peerTrack', { peerId, username: peerUsername, kind: track.kind });
            };
            
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                console.log(`[VoiceFrame] Peer ${peerId} connection: ${state}`);
                if (state === 'connected') {
                    sendToParent('peerConnected', { peerId, username: peerUsername });
                } else if (state === 'failed' || state === 'disconnected') {
                    sendToParent('peerDisconnected', { peerId, username: peerUsername });
                }
            };
            
            if (isInitiator) {
                createAndSendOffer(peerId);
            }
        }
        
        async function createAndSendOffer(peerId) {
            const peerData = peerConnections[peerId];
            if (!peerData) return;
            
            try {
                const offer = await peerData.pc.createOffer({ 
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                await peerData.pc.setLocalDescription(offer);
                
                if (voiceSocket?.readyState === WebSocket.OPEN) {
                    voiceSocket.send(JSON.stringify({
                        signal_type: 'offer',
                        recipient_id: peerId,
                        data: { sdp: offer }
                    }));
                }
            } catch (err) {
                console.error('[VoiceFrame] Offer error:', err);
            }
        }
        
        async function handleWebRTCSignal(data) {
            const senderId = data.sender_id;
            if (senderId === userId) return;
            
            const recipientId = data.recipient_id || data.data?.recipient_id;
            if (recipientId && recipientId !== userId) return;
            
            switch (data.signal_type) {
                case 'offer':
                    await handleOffer(senderId, data);
                    break;
                    
                case 'answer':
                    await handleAnswer(senderId, data);
                    break;
                    
                case 'ice_candidate':
                    await handleIceCandidate(senderId, data);
                    break;
            }
        }
        
        async function handleOffer(senderId, data) {
            let peerData = peerConnections[senderId];
            if (!peerData) {
                createPeerConnection(senderId, data.username, false);
                peerData = peerConnections[senderId];
            }
            if (!peerData?.pc) return;
            
            try {
                await peerData.pc.setRemoteDescription(new RTCSessionDescription(data.data.sdp));
                peerData.remoteDescriptionSet = true;
                await processIceCandidateQueue(senderId);
                
                const answer = await peerData.pc.createAnswer();
                await peerData.pc.setLocalDescription(answer);
                
                if (voiceSocket?.readyState === WebSocket.OPEN) {
                    voiceSocket.send(JSON.stringify({
                        signal_type: 'answer',
                        recipient_id: senderId,
                        data: { sdp: answer }
                    }));
                }
            } catch (err) {
                console.error('[VoiceFrame] Handle offer error:', err);
            }
        }
        
        async function handleAnswer(senderId, data) {
            const peerData = peerConnections[senderId];
            if (!peerData?.pc) return;
            
            try {
                await peerData.pc.setRemoteDescription(new RTCSessionDescription(data.data.sdp));
                peerData.remoteDescriptionSet = true;
                await processIceCandidateQueue(senderId);
            } catch (err) {
                console.error('[VoiceFrame] Handle answer error:', err);
            }
        }
        
        async function handleIceCandidate(senderId, data) {
            const peerData = peerConnections[senderId];
            const candidate = data.data?.candidate;
            if (!candidate) return;
            
            if (peerData?.remoteDescriptionSet) {
                try {
                    await peerData.pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {
                    console.warn('[VoiceFrame] ICE candidate error:', e);
                }
            } else {
                if (!iceCandidateQueues[senderId]) iceCandidateQueues[senderId] = [];
                iceCandidateQueues[senderId].push(candidate);
            }
        }
        
        async function processIceCandidateQueue(peerId) {
            const queue = iceCandidateQueues[peerId];
            const peerData = peerConnections[peerId];
            if (!queue || !peerData?.pc) return;
            
            while (queue.length > 0) {
                const candidate = queue.shift();
                try {
                    await peerData.pc.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {}
            }
        }
        
        function closePeerConnection(peerId) {
            const peerData = peerConnections[peerId];
            if (peerData) {
                if (peerData.pc) peerData.pc.close();
                if (peerData.audioElement) peerData.audioElement.remove();
            }
            delete peerConnections[peerId];
            delete iceCandidateQueues[peerId];
            
            // Remove video element
            const videoContainer = document.getElementById(`video-${peerId}`);
            if (videoContainer) videoContainer.remove();
            
            updateVideoGrid();
        }
        
        // ============================================
        // Media Controls
        // ============================================
        
        function toggleMute() {
            isMuted = !isMuted;
            if (localStream) {
                localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            }
            
            // Update self in participants
            updateParticipantState(username, { muted: isMuted });
            
            // Notify server
            if (voiceSocket?.readyState === WebSocket.OPEN) {
                voiceSocket.send(JSON.stringify({
                    signal_type: 'media_state',
                    data: { muted: isMuted, has_video: isCameraOn, has_screen: isScreenSharing }
                }));
            }
            
            sendToParent('muteChanged', { muted: isMuted });
        }
        
        function toggleDeafen() {
            isDeafened = !isDeafened;
            
            // Mute all audio elements
            document.querySelectorAll('audio').forEach(a => a.muted = isDeafened);
            
            // If deafening, also mute mic
            if (isDeafened && !isMuted) {
                toggleMute();
            }
            
            sendToParent('deafenChanged', { deafened: isDeafened });
        }
        
        async function toggleCamera() {
            if (isCameraOn) {
                // Turn off camera
                if (localVideoStream) {
                    localVideoStream.getTracks().forEach(t => t.stop());
                    localVideoStream = null;
                }
                isCameraOn = false;
            } else {
                // Turn on camera
                try {
                    localVideoStream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 320, height: 240, frameRate: 15 }
                    });
                    isCameraOn = true;
                    
                    // Add video track to all peer connections
                    Object.entries(peerConnections).forEach(([peerId, peerData]) => {
                        localVideoStream.getVideoTracks().forEach(track => {
                            peerData.pc.addTrack(track, localVideoStream);
                        });
                        // Renegotiate
                        createAndSendOffer(peerId);
                    });
                } catch (err) {
                    console.error('[VoiceFrame] Camera error:', err);
                    sendToParent('error', { message: 'Camera error: ' + err.message });
                    return;
                }
            }
            
            updateParticipantState(username, { video: isCameraOn });
            updateVideoGrid();
            
            // Notify server
            if (voiceSocket?.readyState === WebSocket.OPEN) {
                voiceSocket.send(JSON.stringify({
                    signal_type: 'media_state',
                    data: { muted: isMuted, has_video: isCameraOn, has_screen: isScreenSharing }
                }));
            }
            
            sendToParent('cameraChanged', { cameraOn: isCameraOn });
        }
        
        async function toggleScreenShare() {
            if (isScreenSharing) {
                // Stop screen share
                if (localScreenStream) {
                    localScreenStream.getTracks().forEach(t => t.stop());
                    localScreenStream = null;
                }
                isScreenSharing = false;
            } else {
                // Start screen share
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: 'always' },
                        audio: false
                    });
                    isScreenSharing = true;
                    
                    // Handle user stopping share via browser UI
                    localScreenStream.getVideoTracks()[0].onended = () => {
                        toggleScreenShare();
                    };
                    
                    // Add screen track to all peer connections
                    Object.entries(peerConnections).forEach(([peerId, peerData]) => {
                        localScreenStream.getVideoTracks().forEach(track => {
                            peerData.pc.addTrack(track, localScreenStream);
                        });
                        // Renegotiate
                        createAndSendOffer(peerId);
                    });
                } catch (err) {
                    console.error('[VoiceFrame] Screen share error:', err);
                    sendToParent('error', { message: 'Screen share cancelled or error' });
                    return;
                }
            }
            
            updateParticipantState(username, { screen: isScreenSharing });
            updateVideoGrid();
            
            // Notify server
            if (voiceSocket?.readyState === WebSocket.OPEN) {
                voiceSocket.send(JSON.stringify({
                    signal_type: 'media_state',
                    data: { muted: isMuted, has_video: isCameraOn, has_screen: isScreenSharing }
                }));
            }
            
            sendToParent('screenShareChanged', { screenSharing: isScreenSharing });
        }
        
        function setUserVolume(peerId, volume) {
            const peerData = peerConnections[peerId];
            if (peerData?.audioElement) {
                peerData.audioElement.volume = Math.max(0, Math.min(1, volume));
            }
        }
        
        // ============================================
        // Initialize
        // ============================================
        
        console.log('[VoiceFrame] Initialized');
        sendToParent('ready', {});
    </script>
